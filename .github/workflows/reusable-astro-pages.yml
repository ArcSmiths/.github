name: Reusable Astro & Cloudflare Pages CI/CD

on:
  workflow_call:
    inputs:
      working-directory:
        description: Subdirectory containing the site (default repo root)
        type: string
        default: '.'
      site-slug:
        description: Site identifier written into __release.json
        type: string
        required: true
      node-version:
        description: Node.js version
        type: string
        default: '24'
      package-manager:
        description: Package manager (npm or pnpm)
        type: string
        default: 'pnpm'
      pre-build-command:
        description: Optional command to run before build (e.g. unit tests)
        type: string
        default: ''
      build-command:
        description: Build command (empty for pure static sites)
        type: string
        default: 'pnpm build'
      output-dir:
        description: Built static directory relative to working-directory
        type: string
        default: 'dist'
      pages-project:
        description: Cloudflare Pages project name (required if deploy=true)
        type: string
        default: ''
      pages-branch:
        description: Production branch name for Cloudflare Pages
        type: string
        default: 'main'
      deploy:
        description: Deploy to Cloudflare Pages when on master and token is configured
        type: boolean
        default: false
      smoke-url:
        description: Production URL to probe after deploy (checks / and /__release.json)
        type: string
        default: ''
      runner:
        description: JSON runner label spec (defaults to GitHub-hosted ubuntu-latest)
        type: string
        default: '"ubuntu-latest"'
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: site (${{ inputs.site-slug }})
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable pnpm
        if: inputs.package-manager == 'pnpm' && inputs.build-command != ''
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 9

      - name: Install dependencies (locked)
        if: inputs.build-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Pre-build checks
        if: inputs.pre-build-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.pre-build-command }}

      - name: Build site
        if: inputs.build-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Stamp __release.json
        working-directory: ${{ inputs.working-directory }}
        env:
          OUT_DIR: ${{ inputs.output-dir }}
          SITE_SLUG: ${{ inputs.site-slug }}
        run: |
          mkdir -p "$OUT_DIR"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const stamp = {
              repo: process.env.GITHUB_REPOSITORY,
              site: process.env.SITE_SLUG,
              commit: process.env.GITHUB_SHA,
              ref: process.env.GITHUB_REF_NAME,
              runId: process.env.GITHUB_RUN_ID,
              deployedAt: new Date().toISOString(),
            };
            fs.writeFileSync(path.join(process.env.OUT_DIR, "__release.json"), JSON.stringify(stamp, null, 2) + "\n");
            console.log("Stamped __release.json:", JSON.stringify(stamp));
          '

      - name: Deploy to Cloudflare Pages
        if: inputs.deploy && github.ref == 'refs/heads/master'
        working-directory: ${{ inputs.working-directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'e0296ccd090226cec02e729a888cee14' }}
          SMOKE_URL: ${{ inputs.smoke-url }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not provided; skipping live deploy."
            exit 0
          fi
          npx --yes wrangler@4.166.0 pages deploy "${{ inputs.output-dir }}" \
            --project-name="${{ inputs.pages-project }}" \
            --branch="${{ inputs.pages-branch }}" \
            --commit-hash="${{ github.sha }}"
          if [ -n "$SMOKE_URL" ]; then
            sleep 6
            code=$(curl -s -o /dev/null -w '%{http_code}' "${SMOKE_URL}/")
            test "$code" = "200" || { echo "::error::${SMOKE_URL}/ returned HTTP $code"; exit 1; }
            live_sha=$(curl -fsSL "${SMOKE_URL}/__release.json" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); console.log(d.commit||"")')
            echo "Live SHA: $live_sha (expected ${{ github.sha }})"
            test "$live_sha" = "${{ github.sha }}" || { echo "::error::Release SHA mismatch"; exit 1; }
          fi
